[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-pipeline"
version = "0.1.0"
description = "ESG supplier-audit intelligence pipeline: document extraction, risk scoring, and corrective-action tracking on synthetic audit reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Swetha Bethireddy" }]
keywords = ["esg", "document-intelligence", "risk-scoring", "azure", "pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pypdf>=4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
azure = ["azure-ai-documentintelligence>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
dashboard = ["streamlit>=1.35", "pandas>=2.0", "plotly>=5.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "contract: contract tests shared by all extractor implementations",
    "integration: end-to-end pipeline tests",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["src/esg_pipeline"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
