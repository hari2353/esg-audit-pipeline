name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Type check (mypy)
        run: mypy src/esg_pipeline
      - name: Run tests with coverage
        run: pytest --cov=esg_pipeline --cov-report=term-missing
      - name: End-to-end pipeline check
        run: |
          python scripts/generate_samples.py --count 5 --out data/samples --seed 42
          python scripts/run_pipeline.py --samples data/samples --db data/audit.db --json data/results.json
          python scripts/verify_pipeline.py
